<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Deep Imperial Turquoise Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145459"/>
      <stop offset="50%" stop-color="#0b2b2c"/>
      <stop offset="100%" stop-color="#051718"/>
    </linearGradient>
    <!-- Antique Ottoman Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6812"/>
    </linearGradient>
    <!-- Imperial Burgundy Accent Gradient -->
    <linearGradient id="burgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c2428"/>
      <stop offset="100%" stop-color="#3b0a0e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Tile Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <rect x="5" y="5" width="54" height="54" rx="10" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Elegant Gold 'M' Monogram -->
  <path d="M16 45 L16 19 L25 19 L32 31 L39 19 L48 19 L48 45" fill="none" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center Durak Perdesi Jewel (Burgundy & Gold Pearl) -->
  <circle cx="32" cy="45" r="4" fill="url(#burgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#glow)"/>
</svg>
