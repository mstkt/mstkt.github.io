<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Makam Studio - 53-EDO Türk Musikisi & Usul Asistanı</title>
    <meta name="description" content="53 Koma mikrotonal Türk makam ve usul teorisi, seyir tabanlı melodi üretimi, Dem eşlikleri, süsleme motoru ve Web Audio DAW stüdyosu.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Top Header Navigation -->
    <header class="app-header">
        <div class="logo-group">
            <span class="app-logo-badge">MAKAM</span>
            <span class="app-title">Studio</span>
            <span class="app-subtitle">53-EDO Türk Musikisi & Usul Asistanı</span>
        </div>

        <div class="header-controls">
            <!-- Makam Picker -->
            <div class="control-item">
                <label for="makamSelect">MAKAM:</label>
                <select id="makamSelect" class="form-select" style="min-width: 130px;"></select>
            </div>

            <!-- Usul Picker -->
            <div class="control-item">
                <label for="usulSelect">USUL:</label>
                <select id="usulSelect" class="form-select" style="min-width: 140px;"></select>
            </div>

            <!-- Cycles / Bars -->
            <div class="control-item">
                <label for="cycleSelect">ÖLÇÜ:</label>
                <select id="cycleSelect" class="form-select" style="width: 80px;">
                    <option value="2">2 Döngü</option>
                    <option value="4" selected>4 Döngü</option>
                    <option value="8">8 Döngü</option>
                    <option value="12">12 Döngü</option>
                    <option value="16">16 Döngü</option>
                </select>
            </div>

            <!-- BPM Tempo -->
            <div class="control-item">
                <label for="bpmInput">BPM:</label>
                <input type="number" id="bpmInput" class="form-input" min="30" max="300" value="100" style="width: 50px;">
            </div>
        </div>

        <div class="header-actions">
            <button id="btnResetAll" class="btn btn-secondary" title="Tüm parçayı sıfırdan başlatmak için temizle">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span class="btn-text">Sıfırla</span>
            </button>
            <button id="btnGenAll" class="btn btn-primary" title="Tüm melodi, dem, bas ve ritmi baştan üret">
                <svg class="btn-icon gold-fill" viewBox="0 0 24 24"><path d="M7.5 5.6L10 0l2.5 5.6L18 8l-5.5 2.4L10 16 7.5 10.4 2 8l5.5-2.4zm12 11.4l1.5-3.4 1.5 3.4 3.5 1.6-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.6z"/></svg>
                <span class="btn-text">Tümünü Üret</span>
            </button>
            <button id="btnExportMidi" class="btn btn-accent" title="Mikrotonal pitch-bend'li 4 kanallı standart .mid indir">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span class="btn-text">MIDI İndir</span>
            </button>
            <button id="btnToggleSidebar" class="btn btn-secondary btn-toggle-sidebar" title="Makam & Teori Panelini Aç / Kapat">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                <span class="btn-text">Panel</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-main">
        <!-- Center Workspace: Toolbar, Piano Roll, Chord Strip, Mixer -->
        <div class="workspace-center">
            
            <!-- Global Transport & Layer Toolbar -->
            <div class="studio-toolbar">
                <!-- Transport Controls -->
                <div class="tool-section transport-section">
                    <button id="btnPlay" class="btn btn-primary btn-transport">
                        <svg class="btn-icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <span id="playText">Oynat</span>
                    </button>
                    <button id="btnStop" class="btn btn-secondary btn-transport">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                        <span class="btn-text">Durdur</span>
                    </button>
                    <button id="btnLoop" class="btn btn-secondary btn-transport active" title="Döngü (Loop)">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                    </button>
                    <button id="btnUndo" class="btn btn-secondary btn-icon-only" title="Geri Al (Ctrl+Z)">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                    </button>
                    <button id="btnRedo" class="btn btn-secondary btn-icon-only" title="İleri Al (Ctrl+Y)">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
                    </button>
                    <div class="time-container">
                        <div id="timeDisplay" class="time-display">0.00</div>
                    </div>
                </div>

                <!-- Layer Switcher -->
                <div class="tool-section layer-section">
                    <span class="toolbar-lbl">KATMAN:</span>
                    <button class="layer-btn active" data-layer="melody">🎼 Melodi</button>
                    <button class="layer-btn" data-layer="bass">🎸 Bas</button>
                    <button class="layer-btn" data-layer="drums">🥁 Vurmalı</button>
                </div>

                <!-- Editing Tools (Draw / Erase / Delete) -->
                <div class="tool-section action-tools-section">
                    <div class="roll-tools-group">
                        <button class="tool-btn active" data-tool="draw" title="Nota Ekle / Seç (Dokun/Tıkla)">
                            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                            <span>Ekle</span>
                        </button>
                        <button class="tool-btn" data-tool="erase" title="Silgi Modu (Nota üzerine dokunarak anında sil)">
                            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L5.03 20c.39.39.9.59 1.41.59h12.56c.55 0 1-.45 1-1s-.45-1-1-1h-6.17l8.73-8.73c.78-.78.78-2.05 0-2.83l-5-5c-.39-.4-.9-.6-1.42-.6z"/></svg>
                            <span>Silgi</span>
                        </button>
                        <button class="tool-btn" data-tool="pan" title="Kaydır Modu (Enine boyuna sürükle)">
                            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M13 24c-3.26 0-6.19-1.3-8.31-3.41l-1.39-1.39c-.58-.58-.58-1.54 0-2.12l.71-.71c.58-.58 1.54-.58 2.12 0L8 18.25V4.5C8 3.67 8.67 3 9.5 3s1.5.67 1.5 1.5v8.5h1V1.5C12 .67 12.67 0 13.5 0s1.5.67 1.5 1.5v11.5h1v-10C16 2.17 16.67 1.5 17.5 1.5S19 2.17 19 3v10h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5V16c0 4.41-3.59 8-8 8z"/></svg>
                            <span>Kaydır</span>
                        </button>
                    </div>
                    <button id="btnDeleteSelected" class="btn btn-secondary btn-del-sel" title="Seçili Notayı Sil">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        <span>Seçileni Sil</span>
                    </button>
                    <button id="btnClearLayer" class="btn btn-secondary btn-clear-layer" title="Sadece bu katmandaki notaları sil">
                        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19.36 2.72l1.42 1.42c.78.78.78 2.05 0 2.83l-3.5 3.5-4.25-4.25 3.5-3.5c.78-.78 2.05-.78 2.83 0zM3 21h18v-2H3v2zm3.41-5.17l8.49-8.49 4.24 4.25-8.49 8.49H6.41v-4.25z"/></svg>
                        <span>Temizle</span>
                    </button>
                </div>
            </div>

            <!-- Microtonal Piano Roll Canvas -->
            <div class="piano-roll-container">
                <canvas id="pianoRollCanvas"></canvas>
            </div>

            <!-- Dem & Makam Accompaniment Strip -->
            <div id="chordStripContainer" class="chord-strip-container"></div>

            <!-- 4-Channel Mixer, Reverb & Ahenk Selector (Slim DAW Style) -->
            <div id="mixerContainer" class="mixer-wrapper"></div>
        </div>

        <!-- Right Sidebar: Theory, Çeşni, Seyir & Candidate Inspector -->
        <aside id="workspaceSidebar" class="workspace-sidebar">
            <div id="candidatePanelContainer" style="height: 100%; display: flex; flex-direction: column;"></div>
        </aside>
    </main>

    <!-- Mobile Bottom Navigation Bar (< 768px) -->
    <nav class="mobile-bottom-nav">
        <button class="mob-nav-btn active" data-view="studio">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H5c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v12c0 .55-.45 1-1 1z"/></svg>
            <span>Stüdyo</span>
        </button>
        <button class="mob-nav-btn" data-view="makam">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Makam & Perdeler</span>
        </button>
        <button class="mob-nav-btn" data-view="drums">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <span>Usul & Vurmalı</span>
        </button>
        <button class="mob-nav-btn" data-view="dem">
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
            <span>Dem & Eşlik</span>
        </button>
    </nav>

    <!-- Standalone Script (Zero CORS) -->
    <script src="js/makam-studio.js"></script>
</body>
</html>
